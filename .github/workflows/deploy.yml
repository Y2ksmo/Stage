name: Deploy to production

on:
  push:
    branches: [main]

permissions:
  contents: read

# One deploy at a time; a newer push waits instead of cancelling a deploy (or migration) that is already running.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Configure required reviewers on this environment in GitHub (Settings > Environments) for a manual approval gate.
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # Pulls the project's production environment (including NEXT_PUBLIC_TURNSTILE_SITE_KEY, which is inlined at build time).
      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      # Build BEFORE touching the database: a failed build must never leave the database ahead of the live code.
      - name: Build
        run: vercel build --prod --token="$VERCEL_TOKEN"

      # Use a DIRECT (non-pooled) connection string for migrations. Migrations must be backward compatible with the
      # code that is currently live (add first, remove later), because the old version keeps serving until the swap.
      - name: Apply database migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}

      - name: Deploy
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        run: |
          for path in / /methodology /search; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --retry 5 --retry-delay 5 --retry-all-errors "${{ steps.deploy.outputs.url }}$path")
            echo "$path -> $code"
            [ "$code" = "200" ] || { echo "Smoke test failed for $path"; exit 1; }
          done
