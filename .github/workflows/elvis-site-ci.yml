name: Elvis site CI

on:
  pull_request:
    paths:
      - "sites/elvis-and-sons/**"
      - ".github/workflows/elvis-site-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sites/elvis-and-sons/package-lock.json

      - name: Install dependencies
        working-directory: sites/elvis-and-sons
        run: npm ci

      - name: Typecheck
        working-directory: sites/elvis-and-sons
        run: npm run typecheck

      - name: Production build
        working-directory: sites/elvis-and-sons
        run: npm run build
        env:
          NODE_ENV: production
